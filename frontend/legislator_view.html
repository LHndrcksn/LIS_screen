<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="color-scheme" content="light dark">
        <link rel="stylesheet" href="css/pico-main/css/pico.jade.css">
        
        <title>Legislators Viewer</title>    
    </head>


    <body>
        <header class="container">
            <hgroup>
                <h1>View All Legislators</h1>
            </hgroup>
        </header>
        <a href="index.html">Home</a>
        <ul id="legislatorList"></ul>

        
        <script src="js/scripts.js"></script>
        <script>
            let displayList = [];

            fetch(`http://localhost:8080/api/legislators`)
            .then(response => response.json())
            .then((data) => {
                var list = document.getElementById("legislatorList");
                data.forEach((legislator) => {
                    displayList.push(`${legislator.firstName} ${legislator.lastName}` );
                    
                    let li = document.createElement("li");
                    
                    li.innerText = `${legislator.firstName} ${legislator.lastName}, ${legislator.homeTown}`;
                    list.appendChild(li);
                })
                console.log(displayList)
            })
            .catch((err) => {
                console.log(`Error fetching: ${err}`)
            });
        </script>
    </body>
</html>
